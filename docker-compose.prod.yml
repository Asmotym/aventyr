services:
  mysql:
    image: mysql:8.0
    container_name: aventyr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_TCP_PORT: ${MYSQL_PORT}
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - proxy
      - aventyr-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  aventyr:
    build:
      context: .
      target: runner
      args:
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_PROJECT}
        SENTRY_RELEASE: ${SENTRY_RELEASE}
        VITE_BACKEND_URL: https://api.aventyr.io
        VITE_PUBLIC_API_BASE_URL: https://api.aventyr.io/api
        VITE_API_DOCS_URL: https://docs.aventyr.io
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID}
        VITE_DISCORD_REDIRECT_URI: ${VITE_DISCORD_REDIRECT_URI}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-}
      secrets:
        - sentry_auth_token
    image: aventyr-all:latest
    container_name: aventyr-stack
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PORT: 3306
      AVENTYR_DEV_MODE: "false"
      NODE_ENV: production
      ENVIRONMENT: production
      BACKEND_PORT: 4000
      FRONTEND_PORT: 5173
      FRONTEND_URL: https://aventyr.io
      VITE_BACKEND_URL: https://api.aventyr.io
      VITE_PUBLIC_API_BASE_URL: https://api.aventyr.io/api
      VITE_API_DOCS_URL: https://docs.aventyr.io
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: "false"
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      # The upload token is build-only and must never reach the running app.
      SENTRY_AUTH_TOKEN: ""
    restart: unless-stopped
    networks:
      - proxy
      - aventyr-internal

  api-docs:
    image: swaggerapi/swagger-ui:latest
    container_name: aventyr-api-docs
    environment:
      PORT: 6000
      API_DOCS_BASE_URL: https://api.aventyr.io/api
      SWAGGER_JSON: /tmp/aventyr-api.yaml
    command:
      - sh
      - -c
      - sed "s|__API_BASE_URL__|$${API_DOCS_BASE_URL}|g" /openapi/aventyr-api.template.yaml > /tmp/aventyr-api.yaml && /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - ./docs/openapi.template.yaml:/openapi/aventyr-api.template.yaml:ro
    restart: unless-stopped
    networks:
      - proxy

volumes:
  mysql-data:

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

networks:
  proxy:
    external: true
  aventyr-internal:
    name: aventyr-internal
